name: Deploy comments service

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/comments-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMMENTS_GITHUB_TOKEN: ${{ secrets.COMMENTS_GITHUB_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare is connected
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret is not set yet - nothing to deploy."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '20'
      - name: Deploy worker and its secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy
          node -e '
            const o = {};
            for (const k of ["COMMENTS_GITHUB_TOKEN", "BREVO_API_KEY", "NOTIFY_EMAIL"]) if (process.env[k]) o[k] = process.env[k];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(o));
            console.log("secrets to upload:", Object.keys(o).join(", ") || "none");
          '
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
