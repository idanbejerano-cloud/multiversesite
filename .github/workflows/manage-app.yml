# Publishes the management app (manage/public) to Cloudflare Workers:
# https://multiverse-manage.multiversesite.workers.dev/ – see manage/README.md.
name: Deploy management app

on:
  push:
    branches: [main]
    paths: ['manage/**', '.github/workflows/manage-app.yml']
  workflow_dispatch:

concurrency:
  group: manage-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare is connected
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret is not set yet - nothing to deploy."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '20'
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: manage
        run: npx --yes wrangler@4 deploy
