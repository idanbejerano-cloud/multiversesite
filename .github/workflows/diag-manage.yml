# Temporary: checks from outside whether the management app answers. Deleted right after.
name: Diagnose management app (temporary)
on:
  push:
    branches: ['diag/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Google Safe Browsing status
        run: |
          for h in multiverse-manage.multiversesite.workers.dev multiversesite.workers.dev multiverse-site.cloudflareaccess.com multiversesite.com; do
            echo "== $h"; curl -sS -m 20 "https://transparencyreport.google.com/transparencyreport/api/v3/safebrowsing/status?site=$h" | tail -c 300; echo
          done
      - name: Reachability from Israel (check-host.net)
        run: |
          H=multiverse-manage.multiversesite.workers.dev
          curl -sS -m 20 -H 'Accept: application/json' "https://check-host.net/check-http?host=https://$H/&max_nodes=50" > /tmp/req.json || true
          rid=$(python3 -c 'import json; print(json.load(open("/tmp/req.json"))["request_id"])' || echo none)
          python3 -c 'import json; d=json.load(open("/tmp/req.json")); [print("node", k, v[0], v[2]) for k,v in d["nodes"].items()]' | grep -i -E " il | israel|tel aviv|jerusalem|haifa" || echo "no Israeli node in this run"
          sleep 25
          curl -sS -m 20 -H 'Accept: application/json' "https://check-host.net/check-result/$rid" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(k, json.dumps(v)[:170]) for k,v in d.items()]'
          curl -sS -m 20 -H 'Accept: application/json' "https://check-host.net/check-dns?host=$H&max_nodes=50" > /tmp/dreq.json || true
          did=$(python3 -c 'import json; print(json.load(open("/tmp/dreq.json"))["request_id"])' || echo none)
          sleep 15
          curl -sS -m 20 -H 'Accept: application/json' "https://check-host.net/check-result/$did" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print("dns", k, json.dumps(v)[:200]) for k,v in d.items() if k[:2] in ("il","de","us","fr")]'
