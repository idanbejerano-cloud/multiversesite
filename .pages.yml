# Pages CMS (https://app.pagescms.org) – visual editor for this site
media:
- name: images
  label: תמונות
  input: static/wp-content/uploads
  output: /wp-content/uploads
  rename: safe
  categories:
  - image
content:
- name: posts
  label: פוסטים
  type: collection
  path: content/posts
  subfolders: true
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{hour}{minute}{second}.html'
  actions:
  - name: publish
    label: פרסום
    scope: entry
    workflow: publish.yml
    cancelable: false
    confirm:
      title: לפרסם את הפוסט באתר?
      message: הגרסה השמורה של הפוסט תעלה לאתר תוך כמה דקות. אם יש שינויים שלא נשמרו – לבטל, ללחוץ קודם Save ורק אז לפרסם. פוסט שמתפרסם בפעם הראשונה מקבל את התאריך והשעה של עכשיו. אחרי הפרסום מרעננים את העמוד לפני שממשיכים לערוך.
      button: פרסום
  - name: unpublish
    label: החזרה לטיוטה
    scope: entry
    workflow: publish.yml
    cancelable: false
    confirm:
      title: להסיר את הפוסט מהאתר?
      message: הפוסט יוסר מהאתר תוך כמה דקות ויישמר כטיוטה. אפשר לפרסם אותו שוב בכל עת.
      button: החזרה לטיוטה
  view:
    fields:
    - title
    - draft
    - date
    - author
    primary: title
    sort:
    - date
    - title
    search:
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: כותרת
    type: string
    required: true
  - name: draft
    label: טיוטה
    type: boolean
    default: true
    readonly: true
    description: Save שומר בלי לפרסם. כדי שהפוסט יופיע באתר – שומרים ואז לוחצים "פרסום" בראש העמוד. "החזרה לטיוטה" מוריד פוסט מהאתר.
  - name: slug
    label: כתובת הפוסט
    type: string
    description: לא חובה. כמה מילים באנגלית עם מקפים (למשל dune-part-three-review) לכתובת קצרה וקבועה. אם ריק – הכתובת נבנית מהכותרת.
  - name: date
    label: תאריך ושעת פרסום
    type: date
    options:
      time: true
      format: yyyy-MM-dd HH:mm:ss
  - name: author
    label: כותב
    type: select
    options:
      values:
      # BEGIN authors – made from data/authors.yml by tools/update_cms_lists.py, do not edit here
      - name: alonros
        label: אלון רוזנבלום
      - name: idanb
        label: עידן בז'רנו
      - name: galpl
        label: גל פלודה
      - name: talmichels
        label: Tal_Michels
      - name: cundason
        label: cundason
      - name: nitzangel
        label: ניצן ניקי מור
      - name: alonshafir
        label: אלון שפיר
      - name: yehezkelsagiv
        label: yehezkelsagiv
      - name: benaya33
        label: בניה שגיב
      - name: brdroey
        label: רועי ברדה
      - name: shabso
        label: שי גבסו
      - name: hadarperry93
        label: hadarperry93
      - name: idangueta
        label: idangueta
      - name: naamashtein
        label: naamashtein
      - name: nattya01
        label: nattya01
      - name: lipaavihaybob
        label: אביחי בוב
      - name: talmalka
        label: talmalka
      - name: tomersoiker
        label: Tomer Soiker
      - name: adiperl
        label: עדי פרל
      - name: dorshilton
        label: dorshilton
      - name: yanaybn
        label: ינאי בן נח
      # END authors
    description: אם הכותב לא ברשימה, השאירו ריק ומלאו את "שם כותב אחר".
  - name: author_name
    label: שם כותב אחר
    type: string
    description: רק לכותב שאינו ברשימה – השם כפי שיוצג באתר.
  - name: categories
    label: קטגוריות
    type: select
    options:
      multiple: true
      values:
      # BEGIN categories – made from data/categories.yml by tools/update_cms_lists.py, do not edit here
      - name: קולנוע
        label: קולנוע
      - name: ביקורות-קולנוע
        label: ביקורות קולנוע
      - name: חדשות-קולנוע
        label: חדשות קולנוע
      - name: טלוויזיה
        label: טלוויזיה
      - name: ביקורות-טלוויזיה
        label: ביקורות טלוויזיה
      - name: חדשות-טלוויזיה
        label: חדשות טלוויזיה
      - name: קומיקס
        label: קומיקס
      - name: ביקורות-קומיקס
        label: ביקורות קומיקס
      - name: חדשות-קומיקס
        label: חדשות קומיקס
      - name: טריילרים
        label: טריילרים
      - name: כללי
        label: כללי
      - name: geekout
        label: Geekout
      - name: multi-pass
        label: Multi-Pass
      - name: shaninigans
        label: Shaninigans
      - name: בחזרה-לעבר
        label: בחזרה לעבר
      - name: מפה-משם-ומכל-מקום-שבעולם
        label: מפה משם ומכל מקום שבעולם
      # END categories
  - name: tags
    label: תגיות
    type: string
    list: true
    description: מילה או ביטוי בכל שורה
  - name: image
    label: תמונה ראשית
    type: image
    options:
      media: images
  - name: excerpt
    label: תקציר (לא חובה)
    type: text
    description: מוצג בכרטיס בדף הבית. אם ריק – נלקחת פתיחת הפוסט.
  - name: body
    label: תוכן
    type: rich-text
    options:
      format: html
      media: images
    description: 'סרטון יוטיוב, ציוץ, פוסט פייסבוק או אינסטגרם: מדביקים את הקישור לבד בשורה, והוא יוצג באתר כנגן.'
  - name: id
    type: number
    hidden: true
  - name: url
    type: string
    hidden: true
  - name: comments
    type: number
    hidden: true
  - name: embeds
    type: string
    list: true
    hidden: true
  - name: description
    type: string
    hidden: true
  - name: source
    type: string
    hidden: true
  - name: fb_id
    type: string
    hidden: true
- name: pages
  label: עמודים
  type: collection
  path: content/pages
  format: yaml-frontmatter
  filename: '{year}{month}{day}-{hour}{minute}{second}.html'
  view:
    fields:
    - title
    primary: title
  fields:
  - name: title
    label: כותרת
    type: string
    required: true
  - name: slug
    label: כתובת העמוד
    type: string
    description: 'לעמוד חדש: באנגלית, למשל contact. זו תהיה כתובת העמוד. אם ריק – נבנית מהכותרת.'
  - name: image
    label: תמונה ראשית
    type: image
    options:
      media: images
  - name: body
    label: תוכן
    type: rich-text
    options:
      format: html
      media: images
  - name: id
    type: number
    hidden: true
  - name: url
    type: string
    hidden: true
  - name: date
    type: string
    hidden: true
  - name: author
    type: string
    hidden: true
  - name: comments
    type: number
    hidden: true
  - name: embeds
    type: string
    list: true
    hidden: true
- name: comments
  label: תגובות
  type: collection
  path: content/comments/new
  filename: '{year}-{month}-{day}-{primary}.yml'
  format: yaml
  view:
    fields:
    - author
    - post_title
    - approved
    - date
    primary: author
    sort:
    - date
    search:
    - author
    - text
    - post_title
    default:
      sort: date
      order: desc
  operations:
    create: false
    rename: false
  fields:
  - name: approved
    label: מאושר – להציג באתר
    type: boolean
  - name: author
    label: שם
    type: string
  - name: text
    label: תגובה
    type: text
  - name: post_title
    label: פוסט
    type: string
    readonly: true
  - name: post_url
    label: כתובת הפוסט
    type: string
    readonly: true
  - name: date
    label: תאריך
    type: string
    readonly: true
  - name: email
    label: אימייל (לא מוצג באתר)
    type: string
    readonly: true
  - name: id
    type: number
    hidden: true
  - name: post_id
    type: number
    hidden: true
  - name: parent
    type: number
    hidden: true
- name: settings
  label: הגדרות האתר
  type: file
  path: site.yml
  format: yaml
  fields:
  - name: title
    label: שם האתר
    type: string
    required: true
  - name: description
    label: תיאור (מופיע בראש סרגל הצד)
    type: string
  - name: header_image
    label: תמונת הראש (באנר, 1260×240)
    type: image
    options:
      media: images
  - name: facebook
    label: כתובת עמוד הפייסבוק
    type: string
  - name: newsletter_form
    label: כתובת טופס ההרשמה ב-Brevo
    type: string
    description: הכתובת מתוך action="…" בקוד הטופס של Brevo. משמשת את הווידג'ט "הרשמה לניוזלטר".
  - name: comments_endpoint
    label: כתובת שירות התגובות
    type: string
    description: כתובת ה-Worker ב-Cloudflare. אם ריק – טופס התגובות לא מוצג.
  - name: goatcounter
    label: סטטיסטיקות עם כותרות (GoatCounter)
    type: string
    description: הקוד מ-GoatCounter (למשל multiversesite), כתובת הלוח שלכם ב-goatcounter.com או קטע הקוד שהם נותנים. אם ריק – לא נמדד.
  - name: cloudflare_analytics
    label: סטטיסטיקות (Cloudflare Web Analytics)
    type: string
    description: מדביקים כאן את הקוד מ-Cloudflare ← Web Analytics ← Manage site (או רק את ה-token שבתוכו). אם ריק – אין מדידת כניסות.
  - name: per_page
    label: מספר פוסטים בכל עמוד ברשימות
    type: number
  - name: menu
    label: תפריט ראשי
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}{cat}'
    fields:
    - &id001
      name: title
      label: שם בתפריט
      type: string
      description: לא חובה כשבוחרים קטגוריה (יוצג שם הקטגוריה).
    - &id002
      name: cat
      label: קטגוריה
      type: select
      options:
        values:
        - name: geekout
          label: Geekout
        - name: multi-pass
          label: Multi-Pass
        - name: shaninigans
          label: Shaninigans
        - name: בחזרה-לעבר
          label: בחזרה לעבר
        - name: טלוויזיה
          label: טלוויזיה
        - name: ביקורות-טלוויזיה
          label: טלוויזיה › ביקורות טלוויזיה
        - name: חדשות-טלוויזיה
          label: טלוויזיה › חדשות טלוויזיה
        - name: טריילרים
          label: טריילרים
        - name: כללי
          label: כללי
        - name: מפה-משם-ומכל-מקום-שבעולם
          label: מפה משם ומכל מקום שבעולם
        - name: קולנוע
          label: קולנוע
        - name: ביקורות-קולנוע
          label: קולנוע › ביקורות קולנוע
        - name: חדשות-קולנוע
          label: קולנוע › חדשות קולנוע
        - name: קומיקס
          label: קומיקס
        - name: ביקורות-קומיקס
          label: קומיקס › ביקורות קומיקס
        - name: חדשות-קומיקס
          label: קומיקס › חדשות קומיקס
    - &id003
      name: link
      label: או קישור
      type: string
      description: כתובת בתוך האתר (למשל /about/) או כתובת מלאה. לא צריך אם בחרתם קטגוריה.
    - name: children
      label: תת-תפריט
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}{cat}'
      fields:
      - *id001
      - *id002
      - *id003
  - name: sidebar
    label: סרגל הצד (וידג'טים לפי הסדר)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} ({type})'
    fields:
    - name: type
      label: סוג
      type: select
      required: true
      options:
        values:
        - name: top_posts
          label: הנצפים ביותר (תמונות)
        - name: newsletter
          label: הרשמה לניוזלטר (Brevo)
        - name: recent
          label: פוסטים אחרונים
        - name: archives
          label: ארכיון חודשי
        - name: categories
          label: קטגוריות
        - name: facebook
          label: פייסבוק
        - name: rss
          label: RSS
        - name: text
          label: טקסט חופשי
        - name: html
          label: קוד HTML (למשל טופס הרשמה)
    - name: title
      label: כותרת
      type: string
    - name: count
      label: כמה פוסטים (לפוסטים אחרונים)
      type: number
    - name: content
      label: תוכן (טקסט חופשי / קוד HTML / משפט מתחת לכותרת הניוזלטר)
      type: code
      options:
        language: html
  - name: top_posts
    label: פוסטים ב"הנצפים ביותר" (גיבוי)
    type: string
    list: true
    description: הרשימה מתעדכנת לבד כל יום לפי הצפיות. הפוסטים כאן מוצגים רק כשאין עדיין נתוני צפיות. כתובת של פוסט באתר, למשל /2016/05/06/ehrenreich-lands-is-young-han-solo/
  - name: url
    label: כתובת האתר
    type: string
    hidden: true
  - name: language
    type: string
    hidden: true
  - name: media_fallback
    type: string
    hidden: true
- name: authors
  label: כותבים
  type: file
  path: data/authors.yml
  format: yaml
  fields:
  - name: authors
    label: כותבים
    type: object
    list: true
    description: הסדר כאן הוא הסדר ברשימת הבחירה בפוסט. כותב שכבר לא כותב – מכבים את "מופיע ברשימה" במקום למחוק, כדי שהפוסטים הישנים שלו ימשיכו להציג את שמו. השינוי ברשימה מופיע בטופס הפוסט אחרי כמה דקות.
    fields:
    - name: name
      label: שם שמוצג באתר
      type: string
      required: true
    - name: active
      label: מופיע ברשימת הכותבים בפוסט חדש
      type: boolean
      default: true
    - name: slug
      label: מזהה (באנגלית)
      type: string
      description: לכותב חדש אפשר להשאיר ריק – הוא ייווצר לבד מהשם. לא משנים מזהה של כותב שכבר יש לו פוסטים.
- name: categories
  label: קטגוריות
  type: file
  path: data/categories.yml
  format: yaml
  fields:
  - name: categories
    label: קטגוריות
    type: object
    list: true
    description: הסדר כאן הוא הסדר ברשימת הבחירה בפוסט. קטגוריה שלא בשימוש – מכבים את "מופיע ברשימה" במקום למחוק, כדי שהפוסטים הישנים יישארו בה. השינוי מופיע בטופס הפוסט אחרי כמה דקות.
    fields:
    - name: name
      label: שם הקטגוריה
      type: string
      required: true
    - name: active
      label: מופיעה ברשימת הקטגוריות בפוסט חדש
      type: boolean
      default: true
    - name: parent
      label: קטגוריית אב
      type: string
      description: לתת-קטגוריה – שם הקטגוריה שמעליה (למשל קולנוע). פוסט בתת-קטגוריה מופיע גם בעמוד של קטגוריית האב.
    - name: slug
      label: מזהה
      type: string
      description: לקטגוריה חדשה אפשר להשאיר ריק – הוא ייווצר לבד מהשם. לא משנים מזהה של קטגוריה קיימת, כי הוא חלק מהכתובת שלה.
settings:
  commit:
    identity: user
