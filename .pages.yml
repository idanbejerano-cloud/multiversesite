# Pages CMS (https://app.pagescms.org) – visual editor for this site
media:
- name: images
  label: תמונות
  input: static/wp-content/uploads
  output: /wp-content/uploads
  rename: safe
  categories:
  - image
content:
- name: posts
  label: פוסטים
  type: collection
  path: content/posts
  subfolders: true
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{hour}{minute}{second}.html'
  view:
    fields:
    - title
    - date
    - author
    primary: title
    sort:
    - date
    - title
    search:
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: כותרת
    type: string
    required: true
  - name: slug
    label: כתובת הפוסט
    type: string
    description: לא חובה. כמה מילים באנגלית עם מקפים (למשל dune-part-three-review) לכתובת קצרה וקבועה. אם ריק – הכתובת נבנית מהכותרת.
  - name: date
    label: תאריך ושעת פרסום
    type: date
    options:
      time: true
      format: yyyy-MM-dd HH:mm:ss
  - name: author
    label: כותב
    type: select
    options:
      values:
      - name: talmichels
        label: Tal_Michels
      - name: tomersoiker
        label: Tomer Soiker
      - name: cundason
        label: cundason
      - name: dorshilton
        label: dorshilton
      - name: hadarperry93
        label: hadarperry93
      - name: idangueta
        label: idangueta
      - name: naamashtein
        label: naamashtein
      - name: nattya01
        label: nattya01
      - name: talmalka
        label: talmalka
      - name: yehezkelsagiv
        label: yehezkelsagiv
      - name: lipaavihaybob
        label: אביחי בוב
      - name: alonros
        label: אלון רוזנבלום
      - name: alonshafir
        label: אלון שפיר
      - name: benaya33
        label: בניה שגיב
      - name: galpl
        label: גל פלודה
      - name: yanaybn
        label: ינאי בן נח
      - name: nitzangel
        label: ניצן ניקי מור
      - name: adiperl
        label: עדי פרל
      - name: idanb
        label: עידן בז'רנו
      - name: brdroey
        label: רועי ברדה
      - name: shabso
        label: שי גבסו
    description: אם הכותב לא ברשימה, השאירו ריק ומלאו את "שם כותב אחר".
  - name: author_name
    label: שם כותב אחר
    type: string
    description: רק לכותב שאינו ברשימה – השם כפי שיוצג באתר.
  - name: categories
    label: קטגוריות
    type: select
    options:
      multiple: true
      values:
      - name: geekout
        label: Geekout
      - name: multi-pass
        label: Multi-Pass
      - name: shaninigans
        label: Shaninigans
      - name: בחזרה-לעבר
        label: בחזרה לעבר
      - name: טלוויזיה
        label: טלוויזיה
      - name: ביקורות-טלוויזיה
        label: טלוויזיה › ביקורות טלוויזיה
      - name: חדשות-טלוויזיה
        label: טלוויזיה › חדשות טלוויזיה
      - name: טריילרים
        label: טריילרים
      - name: כללי
        label: כללי
      - name: מפה-משם-ומכל-מקום-שבעולם
        label: מפה משם ומכל מקום שבעולם
      - name: קולנוע
        label: קולנוע
      - name: ביקורות-קולנוע
        label: קולנוע › ביקורות קולנוע
      - name: חדשות-קולנוע
        label: קולנוע › חדשות קולנוע
      - name: קומיקס
        label: קומיקס
      - name: ביקורות-קומיקס
        label: קומיקס › ביקורות קומיקס
      - name: חדשות-קומיקס
        label: קומיקס › חדשות קומיקס
  - name: tags
    label: תגיות
    type: string
    list: true
    description: מילה או ביטוי בכל שורה
  - name: image
    label: תמונה ראשית
    type: image
    options:
      media: images
  - name: excerpt
    label: תקציר (לא חובה)
    type: text
    description: מוצג בכרטיס בדף הבית. אם ריק – נלקחת פתיחת הפוסט.
  - name: body
    label: תוכן
    type: rich-text
    options:
      format: html
      media: images
    description: 'סרטון יוטיוב, ציוץ, פוסט פייסבוק או אינסטגרם: מדביקים את הקישור לבד בשורה, והוא יוצג באתר כנגן.'
  - name: id
    type: number
    hidden: true
  - name: url
    type: string
    hidden: true
  - name: comments
    type: number
    hidden: true
  - name: embeds
    type: string
    list: true
    hidden: true
  - name: description
    type: string
    hidden: true
  - name: source
    type: string
    hidden: true
  - name: fb_id
    type: string
    hidden: true
- name: pages
  label: עמודים
  type: collection
  path: content/pages
  format: yaml-frontmatter
  filename: '{year}{month}{day}-{hour}{minute}{second}.html'
  view:
    fields:
    - title
    primary: title
  fields:
  - name: title
    label: כותרת
    type: string
    required: true
  - name: slug
    label: כתובת העמוד
    type: string
    description: 'לעמוד חדש: באנגלית, למשל contact. זו תהיה כתובת העמוד. אם ריק – נבנית מהכותרת.'
  - name: image
    label: תמונה ראשית
    type: image
    options:
      media: images
  - name: body
    label: תוכן
    type: rich-text
    options:
      format: html
      media: images
  - name: id
    type: number
    hidden: true
  - name: url
    type: string
    hidden: true
  - name: date
    type: string
    hidden: true
  - name: author
    type: string
    hidden: true
  - name: comments
    type: number
    hidden: true
  - name: embeds
    type: string
    list: true
    hidden: true
- name: settings
  label: הגדרות האתר
  type: file
  path: site.yml
  format: yaml
  fields:
  - name: title
    label: שם האתר
    type: string
    required: true
  - name: description
    label: תיאור (מופיע בראש סרגל הצד)
    type: string
  - name: header_image
    label: תמונת הראש (באנר, 1260×240)
    type: image
    options:
      media: images
  - name: facebook
    label: כתובת עמוד הפייסבוק
    type: string
  - name: per_page
    label: מספר פוסטים בכל עמוד ברשימות
    type: number
  - name: menu
    label: תפריט ראשי
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}{cat}'
    fields:
    - &id001
      name: title
      label: שם בתפריט
      type: string
      description: לא חובה כשבוחרים קטגוריה (יוצג שם הקטגוריה).
    - &id002
      name: cat
      label: קטגוריה
      type: select
      options:
        values:
        - name: geekout
          label: Geekout
        - name: multi-pass
          label: Multi-Pass
        - name: shaninigans
          label: Shaninigans
        - name: בחזרה-לעבר
          label: בחזרה לעבר
        - name: טלוויזיה
          label: טלוויזיה
        - name: ביקורות-טלוויזיה
          label: טלוויזיה › ביקורות טלוויזיה
        - name: חדשות-טלוויזיה
          label: טלוויזיה › חדשות טלוויזיה
        - name: טריילרים
          label: טריילרים
        - name: כללי
          label: כללי
        - name: מפה-משם-ומכל-מקום-שבעולם
          label: מפה משם ומכל מקום שבעולם
        - name: קולנוע
          label: קולנוע
        - name: ביקורות-קולנוע
          label: קולנוע › ביקורות קולנוע
        - name: חדשות-קולנוע
          label: קולנוע › חדשות קולנוע
        - name: קומיקס
          label: קומיקס
        - name: ביקורות-קומיקס
          label: קומיקס › ביקורות קומיקס
        - name: חדשות-קומיקס
          label: קומיקס › חדשות קומיקס
    - &id003
      name: link
      label: או קישור
      type: string
      description: כתובת בתוך האתר (למשל /about/) או כתובת מלאה. לא צריך אם בחרתם קטגוריה.
    - name: children
      label: תת-תפריט
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}{cat}'
      fields:
      - *id001
      - *id002
      - *id003
  - name: sidebar
    label: סרגל הצד (וידג'טים לפי הסדר)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} ({type})'
    fields:
    - name: type
      label: סוג
      type: select
      required: true
      options:
        values:
        - name: top_posts
          label: הנצפים ביותר (תמונות)
        - name: recent
          label: פוסטים אחרונים
        - name: archives
          label: ארכיון חודשי
        - name: categories
          label: קטגוריות
        - name: facebook
          label: פייסבוק
        - name: rss
          label: RSS
        - name: text
          label: טקסט חופשי
        - name: html
          label: קוד HTML (למשל טופס הרשמה)
    - name: title
      label: כותרת
      type: string
    - name: count
      label: כמה פוסטים (לפוסטים אחרונים)
      type: number
    - name: content
      label: תוכן (לטקסט חופשי / קוד HTML)
      type: code
      options:
        language: html
  - name: top_posts
    label: פוסטים ב"הנצפים ביותר"
    type: string
    list: true
    description: כתובת של פוסט באתר, למשל /2016/05/06/ehrenreich-lands-is-young-han-solo/
  - name: url
    label: כתובת האתר
    type: string
    hidden: true
  - name: language
    type: string
    hidden: true
  - name: media_fallback
    type: string
    hidden: true
settings:
  commit:
    identity: user
